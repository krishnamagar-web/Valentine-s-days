<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Promise Day</title>
<style>

body{
  margin:0;
  padding:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fbe5dc;
  font-family:Arial, sans-serif;
}

.card{
  background:#ffc0cb;
  width:90%;
  max-width:500px;
  padding:40px 25px;
  text-align:center;
  border-radius:25px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.emoji{
  font-size:60px;
  margin-bottom:15px;
}

h1{
  margin:10px 0;
  font-size:30px;
}

p{
  font-size:16px;
  margin-bottom:25px;
}

.btn{
  display:inline-block;
  padding:12px 30px;
  background:#ff2b2b;
  color:white;
  text-decoration:none;
  border-radius:30px;
  font-weight:bold;
  transition:0.3s;
}

.btn:hover{
  background:#e60000;
}

</style>
</head>

<body>

<div class="card">
  <div class="emoji">🧸💖🧸</div>
  <h1>Happy Promise Day Baby! 💍</h1>
  <p>Every promise with you is a step closer to forever 💕</p>
  <a href="message.html" class="btn">Next ➜</a>
</div>

</body>
</html>
